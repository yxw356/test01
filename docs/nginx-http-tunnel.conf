# 企业知识中枢 — 本机 HTTP 反代（供 Cloudflare Tunnel / 内网穿透 使用）
# 无自有域名时：隧道入口提供公网 HTTPS，本机 Nginx 只监听 127.0.0.1:8080
#
# 部署：
#   pnpm build && sudo cp -r frontend/dist/* /var/www/enterprise-kb/
#   sudo cp docs/nginx-http-tunnel.conf /etc/nginx/sites-available/enterprise-kb-tunnel.conf
#   sudo ln -sf /etc/nginx/sites-available/enterprise-kb-tunnel.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   cloudflared tunnel --url http://127.0.0.1:8080

server {
    listen 127.0.0.1:8080;
    server_name localhost;

    client_max_body_size 100m;

    root /var/www/enterprise-kb;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /proxy-ws/ {
        rewrite ^/proxy-ws(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
