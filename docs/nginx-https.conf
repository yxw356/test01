# 企业知识中枢 — 公网 HTTPS（Nginx 模板）
# 使用前请将 kb.example.com 替换为真实域名，并配置证书路径。
#
# 部署：
#   sudo cp docs/nginx-https.conf /etc/nginx/sites-available/enterprise-kb.conf
#   sudo ln -s /etc/nginx/sites-available/enterprise-kb.conf /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d 你的域名
#
# 前端静态目录：pnpm build 后复制 dist 到 /var/www/enterprise-kb

# HTTP → HTTPS 重定向（Certbot 可自动追加；也可保留本段）
server {
    listen 80;
    listen [::]:80;
    server_name kb.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kb.example.com;

    # --- 测试期可选：仅允许指定 IP 访问（取消注释并修改 IP）---
    # allow 203.0.113.50;
    # deny all;

    # Certbot 生成的证书路径（域名替换后由 certbot 写入）
    ssl_certificate     /etc/letsencrypt/live/kb.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kb.example.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # 上传大文件（与 Spring multipart 上限协调）
    client_max_body_size 100m;

    root /var/www/enterprise-kb;
    index index.html;

    # Vue history 路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 REST API（context: /api/v1/...）
    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # WebSocket：前端 wss://域名/proxy-ws/chat/{token}
    location /proxy-ws/ {
        rewrite ^/proxy-ws(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 可选：Spring Boot 根健康检查（若需）
    location = /health-upstream {
        proxy_pass http://127.0.0.1:8081/;
        proxy_set_header Host $host;
    }
}
